{% extends 'base.html' %}

{% block content %}
  <h2>Удалить объявление</h2>
  <p>Вы уверены, что хотите удалить это объявление?</p>

  <div>
    <p><strong>Название объявления:</strong> {{ object.title }}</p>
    <p><strong>Описание:</strong> {{ object.description }}</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'ads:ad_detail' object.pk %}" class="btn btn-secondary">Отменить</a>
  </form>
{% endblock %}
